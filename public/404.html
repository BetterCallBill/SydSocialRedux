<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Syd Social</title>
    <!--
      GitHub Pages is a static host with no server-side rewrite, so a hard
      refresh or deep link on a client-side route (e.g. /events/123) 404s.
      This is the standard spa-github-pages redirect: it round-trips the
      real path through a query string back to index.html, where an inline
      script (see index.html) restores it via history.replaceState before
      React Router mounts. https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // project page: username.github.io/SydSocialRedux/...

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
